groups:
  - name: corridas
    rules:
      - alert: ApiTaxaDeErroAlta
        expr: |
          (sum(rate(http_requests_total{job="api",status_code=~"5.."}[5m]))
            / sum(rate(http_requests_total{job="api"}[5m])) > 0.05)
          and (sum(rate(http_requests_total{job="api"}[5m])) > 0.1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Taxa de erros da API acima de 5%
          description: Mais de 5% de respostas 5xx por 5 minutos indica falha persistente; o piso de 0,1 req/s evita ruído com poucas requisições.
      - alert: EventosAtrasados
        expr: |
          (max(outbox_oldest_pending_age_seconds{job="api"}) > 30)
          or (histogram_quantile(0.95, sum by (le) (rate(worker_event_lag_seconds_bucket{job="worker"}[5m]))) > 30)
          or (max(rabbitmq_detailed_queue_messages_ready{job="rabbitmq",vhost="/",queue="corridas.worker"}) > 100)
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: Pipeline de eventos atrasado
          description: Outbox ou p95 de lag acima de 30s, ou mais de 100 mensagens prontas por 2 minutos indica acúmulo persistente; a fila detecta worker parado sem amostras de lag.
