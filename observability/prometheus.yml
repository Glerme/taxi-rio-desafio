global:
  scrape_interval: 15s
rule_files:
  - alerts.yml
scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: [api:3000]
  - job_name: worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker:3001]
  - job_name: rabbitmq
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]
      vhost: [/]
    static_configs:
      - targets: [rabbitmq:15692]
