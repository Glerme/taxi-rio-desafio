rule_files:
- alerts.yml
evaluation_interval: 1m
tests:
- name: 5xx sustentados com trafego
  interval: 1m
  input_series:
  - series: http_requests_total{job="api",status_code="500"}
    values: 0+60x10
  - series: http_requests_total{job="api",status_code="200"}
    values: 0+540x10
  alert_rule_test:
  - eval_time: 10m
    alertname: ApiTaxaDeErroAlta
    exp_alerts: &id003
    - exp_labels:
        severity: critical
      exp_annotations:
        summary: Taxa de erros da API acima de 5%
        description: Mais de 5% de respostas 5xx por 5 minutos indica falha persistente;
          o piso de 0,1 req/s evita ruído com poucas requisições.
- name: pouco trafego nao alerta
  interval: 1m
  input_series:
  - series: http_requests_total{job="api",status_code="500"}
    values: 0+1x10
  alert_rule_test:
  - eval_time: 10m
    alertname: ApiTaxaDeErroAlta
    exp_alerts: []
- name: outbox atrasada
  interval: 1m
  input_series:
  - series: outbox_oldest_pending_age_seconds{job="api"}
    values: 12+0x10
  alert_rule_test:
  - eval_time: 10m
    alertname: EventosAtrasados
    exp_alerts: &id004
    - exp_labels: &id001
        severity: warning
      exp_annotations: &id002
        summary: Pipeline de eventos atrasado (limiares calibrados com k6)
        description: Outbox ou p95 de lag acima de 10s, ou mais de 100 mensagens prontas por 2 minutos; k6 mediu baseline de 0,575s/3,577s e pico de 11,652s/~29s (outbox/lag). A fila detecta worker parado sem amostras de lag.
- name: p95 atrasado
  interval: 1m
  input_series:
  - series: worker_event_lag_seconds_bucket{job="worker",le="10"}
    values: 0+170x10
  - series: worker_event_lag_seconds_bucket{job="worker",le="30"}
    values: 0+180x10
  - series: worker_event_lag_seconds_bucket{job="worker",le="+Inf"}
    values: 0+180x10
  alert_rule_test:
  - eval_time: 2m
    alertname: EventosAtrasados
    exp_alerts: []
  - eval_time: 3m
    alertname: EventosAtrasados
    exp_alerts:
    - exp_labels: *id001
      exp_annotations: *id002
- name: worker sem amostras e fila acumulada
  interval: 1m
  input_series:
  - series: rabbitmq_detailed_queue_messages_ready{job="rabbitmq",vhost="/",queue="corridas.worker"}
    values: 101+0x10
  alert_rule_test:
  - eval_time: 10m
    alertname: EventosAtrasados
    exp_alerts:
    - exp_labels: *id001
      exp_annotations: *id002
- name: trafego alto com 1% de 5xx nao alerta
  interval: 1m
  input_series:
  - series: http_requests_total{job="api",status_code="500"}
    values: 0+6x12
  - series: http_requests_total{job="api",status_code="200"}
    values: 0+594x12
  alert_rule_test:
  - eval_time: 12m
    alertname: ApiTaxaDeErroAlta
    exp_alerts: []
- name: pipeline abaixo dos tres limiares nao alerta
  interval: 1m
  input_series:
  - series: outbox_oldest_pending_age_seconds{job="api"}
    values: 9+0x10
  - series: worker_event_lag_seconds_bucket{job="worker",le="5"}
    values: 0+150x10
  - series: worker_event_lag_seconds_bucket{job="worker",le="10"}
    values: 0+200x10
  - series: worker_event_lag_seconds_bucket{job="worker",le="+Inf"}
    values: 0+200x10
  - series: rabbitmq_detailed_queue_messages_ready{job="rabbitmq",vhost="/",queue="corridas.worker"}
    values: 99+0x10
  alert_rule_test:
  - eval_time: 10m
    alertname: EventosAtrasados
    exp_alerts: []
- name: API muda em 6m e aguarda exatamente 5m antes de disparar
  interval: 1m
  input_series:
  - series: http_requests_total{job="api",status_code="500"}
    values: 0+0x5 600+600x6
  - series: http_requests_total{job="api",status_code="200"}
    values: 0+600x5 3000+0x6
  alert_rule_test:
  - eval_time: 5m
    alertname: ApiTaxaDeErroAlta
    exp_alerts: []
  - eval_time: 10m
    alertname: ApiTaxaDeErroAlta
    exp_alerts: []
  - eval_time: 11m
    alertname: ApiTaxaDeErroAlta
    exp_alerts: *id003
  promql_expr_test:
  - expr: ALERTS{alertname="ApiTaxaDeErroAlta",alertstate="pending"}
    eval_time: 10m
    exp_samples:
    - labels: ALERTS{alertname="ApiTaxaDeErroAlta",alertstate="pending",severity="critical"}
      value: 1
- name: outbox muda em 5m e aguarda exatamente 2m antes de disparar
  interval: 1m
  input_series:
  - series: outbox_oldest_pending_age_seconds{job="api"}
    values: 0+0x4 12+0x5
  alert_rule_test:
  - eval_time: 4m
    alertname: EventosAtrasados
    exp_alerts: []
  - eval_time: 6m
    alertname: EventosAtrasados
    exp_alerts: []
  - eval_time: 7m
    alertname: EventosAtrasados
    exp_alerts: *id004
  promql_expr_test:
  - expr: ALERTS{alertname="EventosAtrasados",alertstate="pending"}
    eval_time: 6m
    exp_samples:
    - labels: ALERTS{alertname="EventosAtrasados",alertstate="pending",severity="warning"}
      value: 1
- name: outbox exatamente no limiar nao alerta
  interval: 1m
  input_series:
  - series: outbox_oldest_pending_age_seconds{job="api"}
    values: 10+0x10
  alert_rule_test:
  - eval_time: 10m
    alertname: EventosAtrasados
    exp_alerts: []
- name: p95 exatamente no limiar nao alerta
  interval: 1m
  input_series:
  - series: worker_event_lag_seconds_bucket{job="worker",le="10"}
    values: 0+190x10
  - series: worker_event_lag_seconds_bucket{job="worker",le="30"}
    values: 0+200x10
  - series: worker_event_lag_seconds_bucket{job="worker",le="+Inf"}
    values: 0+200x10
  alert_rule_test:
  - eval_time: 10m
    alertname: EventosAtrasados
    exp_alerts: []
